<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Management</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body { padding-top: 50px; padding-bottom: 20px; }
    .form-container { max-width: 600px; margin: 0 auto; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
  <a class="navbar-brand" href="/">Store Management</a>
</nav>

<div class="container">
  <div class="form-container">
    <h2>Add New Product</h2>

    <form id="add-product-form">
      <div class="form-group">
        <label for="pname">Name</label>
        <input type="text" class="form-control" id="pname" required>
      </div>

      <div class="form-group">
        <label for="pdesc">Description</label>
        <input type="text" class="form-control" id="pdesc">
      </div>

      <div class="form-group">
        <label for="pprice">Price</label>
        <input type="number" step="0.01" class="form-control" id="pprice" required>
      </div>

      <div class="form-group">
        <label for="pstock">Stock</label>
        <input type="number" class="form-control" id="pstock" required>
      </div>

      <button type="button" class="btn btn-success" onclick="createProduct()">Create Product</button>
    </form>
  </div>

  <hr>

  <h2>Products List</h2>
  <table id="product-list" class="table table-striped">
    <thead>
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <button type="button" class="btn btn-primary" onclick="getProducts()">Get Products</button>
</div>

<script src="/static/scriptProducts.js"></script>
</body>
</html>
