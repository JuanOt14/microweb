<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Product</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>

<div class="container">
  <h2>Edit Product</h2>
  <a href="/products" class="btn btn-primary mb-3">Back to Products</a>

  <form id="edit-product-form">
    <input type="hidden" id="product-id" value="">

    <div class="form-group">
      <label for="pname">Name</label>
      <input type="text" class="form-control" id="pname" required>
    </div>

    <div class="form-group">
      <label for="pdesc">Description</label>
      <input type="text" class="form-control" id="pdesc">
    </div>

    <div class="form-group">
      <label for="pprice">Price</label>
      <input type="number" step="0.01" class="form-control" id="pprice" required>
    </div>

    <div class="form-group">
      <label for="pstock">Stock</label>
      <input type="number" class="form-control" id="pstock" required>
    </div>

    <button type="button" class="btn btn-success" onclick="updateProduct()">Save Changes</button>
  </form>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="/static/scriptProducts.js"></script>

<script>
  const productId = {{id}};

  fetch(`http://192.168.80.3:5003/api/products/${productId}`)
    .then(r => r.json())
    .then(data => {
      document.getElementById('product-id').value = data.id;
      document.getElementById('pname').value = data.name;
      document.getElementById('pdesc').value = data.description || '';
      document.getElementById('pprice').value = data.price;
      document.getElementById('pstock').value = data.stock;
    })
    .catch(err => console.error('Error:', err));
</script>

</body>
</html>
